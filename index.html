<!DOCTYPE html>

  <style>
    .calendar-wrapper {
      overflow-x: auto;

    }

      display: flex;

    }

      height: 100%;

      box-sizing: border-box;

      font-weight: 700;

      flex-direction: column;

      text-align: center;
      margin: auto 0;

      overflow: hidden;

    }

    /* Afisare numerotata a numelor 1. Nume, 2. Nume */

      overflow: hidden;

    .fc-timegrid-slots tr[data-time="07:00:00"] td,
    .fc-timegrid-slots tr[data-time="07:00:00"] th { border-top: 4px solid #2563eb !important; }
    .fc-timegrid-slots tr[data-time="17:00:00"] td,
    .fc-timegrid-slots tr[data-time="17:00:00"] th { border-top: 4px solid #ea580c !important; }

    #shiftSidebar {
      position: absolute; left: 0; top: 0; bottom: 0; width: 30px;
      display: flex; flex-direction: column; z-index: 10;
      border-radius: 6px 0 0 6px; overflow: hidden;
      box-shadow: 2px 0 4px rgba(0,0,0,0.1); pointer-events: none; user-select: none;
    }

    .shift-section {
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 11px; font-weight: 800;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .shift-section span { writing-mode: vertical-lr; transform: rotate(180deg); white-space: nowrap; }

    /* Stiluri extra pentru modalul de congregații */
    .cong-accordion-content {
      display: none;
    }
    .cong-accordion-content.open {
      display: block;
    }
  </style>
</head>

  <!-- SCRIPT LOGICĂ CU INTEGRARE FIREBASE FIRESTORE -->
  <script type="module">
    // 1. Configurare și inițializare Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCWJzoehKkF4_SS2GVTKqIpoFCBpi0lWtc",
      authDomain: "pazapv-85f92.firebaseapp.com",
      projectId: "pazapv-85f92",
      storageBucket: "pazapv-85f92.firebasestorage.app",
      messagingSenderId: "764720542420",
      appId: "1:764720542420:web:199cfbef06c7ffb66ec141",
      measurementId: "G-TSGE08LGVF"
    };

    // Inițializare instanță Firebase și Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Stare globală
    let calendar = null;
    let isAdmin = false;
    const ADMIN_PIN = "66401";
    let currentSelectedEvent = null; // Evenimentul curent pentru modalul de detalii/editare

    // Date congregații
    const defaultCongs = [
      { id: 'c1', name: 'Congregația Locală', short: 'Loc', people: ['Ion Popa', 'Andrei V.'] },
      { id: 'c2', name: 'Congregația Vecină 1', short: 'Vec1', people: ['Vasile T.'] },
      { id: 'c3', name: 'Congregația Vecină 2', short: 'Vec2', people: ['Gheorghe M.'] }
    ];
    let congregations = [...defaultCongs];

    // Returnează toate persoanele din toate congregațiile cu detalii congregație
    function getAllRegisteredPeople() {
      const list = [];
      congregations.forEach(c => {
        if (Array.isArray(c.people)) {
          c.people.forEach(p => {
            list.push({
              name: p,
              congId: c.id,
              congName: c.name,
              congShort: c.short
            });
          });
        }
      });
      return list;
    }

    // Salvare congregații în Firebase Firestore
    async function saveCongregations() {
      try {
        await setDoc(doc(db, "setari", "congregatii"), { list: congregations });
      } catch (err) {
        console.error("Eroare la salvarea congregațiilor în Firebase:", err);
      }
    }

    // Ascultare în timp real a congregațiilor din Firebase
    function listenToCongregations() {
      const congDocRef = doc(db, "setari", "congregatii");
      onSnapshot(congDocRef, async (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (Array.isArray(data.list) && data.list.length > 0) {
            congregations = data.list;
          } else {
            congregations = [...defaultCongs];
            await saveCongregations();
          }
        } else {
          congregations = [...defaultCongs];
          await saveCongregations();
        }
        
        if (!document.getElementById('congregationModal').classList.contains('hidden')) {
          renderCongregationsManager();
        }
        if (calendar) {
          calendar.render();
        }
      }, (error) => {
        console.error("Eroare la ascultarea congregațiilor din Firebase:", error);
      });
    }

    // Ascultare în timp real a turelor (evenimentelor) din colecția 'ture_paza'
    function listenToEvents() {
      const eventsColRef = collection(db, "ture_paza");
      onSnapshot(eventsColRef, (snapshot) => {
        if (!calendar) return;

        const serverEventIds = new Set();
        
        snapshot.forEach((docItem) => {
          const evtData = docItem.data();
          serverEventIds.add(evtData.id);

          const existingEvent = calendar.getEventById(evtData.id);
          if (existingEvent) {
            existingEvent.setProp('title', evtData.title);
            existingEvent.setStart(evtData.start);
            existingEvent.setEnd(evtData.end);
            existingEvent.setProp('backgroundColor', evtData.backgroundColor);
            existingEvent.setProp('borderColor', evtData.borderColor);
            existingEvent.setExtendedProp('volunteers', evtData.volunteers || []);
            existingEvent.setExtendedProp('congregationId', evtData.extendedProps?.congregationId || '');
          } else {
            calendar.addEvent({
              id: evtData.id,
              title: evtData.title,
              start: evtData.start,
              end: evtData.end,
              backgroundColor: evtData.backgroundColor,
              borderColor: evtData.borderColor,
              extendedProps: {
                volunteers: evtData.volunteers || [],
                congregationId: evtData.extendedProps?.congregationId || ''
              }
            });
          }
        });

        // Curățare evenimente șterse
        calendar.getEvents().forEach((localEvt) => {
          if (!serverEventIds.has(localEvt.id)) {
            localEvt.remove();
          }
        });
      }, (error) => {
        console.error("Eroare la ascultarea turelor din Firebase:", error);
      });
    }

    // Salvare tură în Firebase Firestore
    async function saveEventToFirebase(eventData) {
      try {
        await setDoc(doc(db, "ture_paza", eventData.id), eventData);
      } catch (err) {
        console.error("Eroare la salvarea turei în Firebase:", err);
        alert("Eroare la sincronizarea cu baza de date Firebase.");
      }
    }

    // Ștergere tură din Firebase Firestore
    async function deleteEventFromFirebase(id) {
      try {
        await deleteDoc(doc(db, "ture_paza", id));
      } catch (err) {
        console.error("Eroare la ștergerea turei din Firebase:", err);
        alert("Eroare la ștergerea din baza de date Firebase.");
      }
    }

    function renderShiftSidebar() {
      const timegridBody = document.querySelector('.fc-timegrid-body');
      if (!timegridBody) return;
      if (document.getElementById('shiftSidebar')) return;
      timegridBody.style.position = 'relative';
      const sidebar = document.createElement('div');
      sidebar.id = 'shiftSidebar';
      sidebar.innerHTML = `
        <div class="shift-section bg-blue-600 border-b border-white/20" style="height: 41.6667%;" title="Pază de Acces (07:00 - 17:00)"><span>PAZĂ ACCES</span></div>
        <div class="shift-section bg-amber-600 border-b border-white/20" style="height: 16.6666%;" title="Pază de Seară (17:00 - 21:00)"><span>PAZĂ SEARĂ</span></div>
        <div class="shift-section bg-red-600" style="height: 41.6667%;" title="Pază de Noapte (21:00 - 07:00)"><span>PAZĂ NOAPTE</span></div>
      `;
      timegridBody.prepend(sidebar);
    }

    function colorizeTimeSlot(arg, isLabel) {
      const tr = arg.el.closest('tr');
      if (!tr) return;
      const timeAttr = tr.getAttribute('data-time');
      if (!timeAttr) return;
      const hour = parseInt(timeAttr.split(':')[0]);
      let color = '';
      if (hour >= 7 && hour < 17) color = isLabel ? '#dbeafe' : '#eff6ff';
      else if (hour >= 17 && hour < 21) color = isLabel ? '#ffedd5' : '#fff7ed';
      else if (hour >= 21 && hour < 31) color = isLabel ? '#fee2e2' : '#fef2f2';
      if (color) arg.el.style.backgroundColor = color;
    }

    // Extrage lista de voluntari dintr-un eveniment (asigură compatibilitate retroactivă)
    function getVolunteersFromEvent(event) {
      if (event.extendedProps && Array.isArray(event.extendedProps.volunteers) && event.extendedProps.volunteers.length > 0) {
        return event.extendedProps.volunteers;
      }
      // Daca tura era salvata vechi cu titlu simplu
      const title = event.title || '';
      const lines = title.split('\n').filter(l => l.trim().length > 0);
      if (lines.length > 0) {
        return lines.map(line => {
          const cleanName = line.replace(/^\d+[\.\)]\s*/, '').trim();
          const found = getAllRegisteredPeople().find(p => p.name.toLowerCase() === cleanName.toLowerCase());
          return {
            name: cleanName,
            congregationId: found ? found.congId : (event.extendedProps?.congregationId || ''),
            congregationName: found ? found.congName : ''
          };
        });
      }
      return [];
    }

    function initCalendar() {
      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        locale: 'ro',
        initialView: 'timeGridSevenDays',
        views: { timeGridSevenDays: { type: 'timeGrid', duration: { days: 7 }, buttonText: '7 Zile' } },
        validRange: { start: '2026-09-01', end: '2027-03-01' },
        headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
        slotMinTime: '07:00:00', slotMaxTime: '31:00:00', slotDuration: '01:00:00', 
        slotEventOverlap: false, allDaySlot: false, editable: false, selectable: false,
        selectMirror: true, height: 'auto',
        longPressDelay: 100, selectLongPressDelay: 100, eventLongPressDelay: 100,
        datesSet: function() { setTimeout(renderShiftSidebar, 50); },
        slotLabelDidMount: function(arg) { colorizeTimeSlot(arg, true); },
        slotLaneDidMount: function(arg) { colorizeTimeSlot(arg, false); },

        eventContent: function(arg) {

          const end = arg.event.end ? arg.event.end.toLocaleTimeString('ro-RO', {hour: '2-digit', minute:'2-digit'}) : '';
          const volunteers = getVolunteersFromEvent(arg.event);

          let namesHtml = '';
          if (volunteers.length > 0) {
            namesHtml = volunteers.map((v, i) => `
              <div class="fc-event-person-row">
                <span class="opacity-90">${i + 1}.</span> ${v.name}
              </div>
            `).join('');
          } else {
            namesHtml = `<div class="fc-event-person-row">${arg.event.title || 'Tură Pază'}</div>`;

            <div class="fc-custom-event-card">
              <div class="fc-event-time-header">
                <div>${start}</div>
                <div class="time-divider"></div>
                <div>${end}</div>
              </div>
              <div class="fc-event-body-centered">
                ${namesHtml}
              </div>
            </div>
          `;

    /* ==== MODAL DETALII TURĂ (LA CLICK PE TURĂ) ==== */

    /* ==== MODAL ADĂUGARE / EDITARE TURE CU SLOTURI 1., 2., 3. ȘI CĂUTARE AUTOCOMPLETE + BUTON MANUAL ==== */

    // Stocare stare dinamică a sloturilor de voluntari în modal
    let volunteerSlotsState = [];

    function openEventModal(event = null, startStr = '', endStr = '') {
      document.getElementById('eventModal').classList.remove('hidden');
      volunteerSlotsState = [];

      if (event) {
        document.getElementById('eventModalTitle').innerText = "Editează Tură";
        document.getElementById('eventId').value = event.id;
        document.getElementById('eventStart').value = formatDateForInput(event.start);
        document.getElementById('eventEnd').value = formatDateForInput(event.end);
        document.getElementById('btnDeleteEvent').classList.remove('hidden');

        // Preluăm voluntarii existenți
        const existingVolunteers = getVolunteersFromEvent(event);
        if (existingVolunteers.length > 0) {
          existingVolunteers.forEach(v => {
            volunteerSlotsState.push({
              name: v.name || '',
              congregationId: v.congregationId || '',
              congregationName: v.congregationName || '',
              confirmed: true
            });
          });
        }
        // Asigurăm că avem cel puțin slot 1 și slot 2
        while (volunteerSlotsState.length < 2) {
          volunteerSlotsState.push({ name: '', congregationId: '', congregationName: '', confirmed: false });
        }
      } else {
        document.getElementById('eventModalTitle').innerText = "Adaugă Tură";
        document.getElementById('eventId').value = '';
        document.getElementById('eventStart').value = startStr ? formatDateForInput(new Date(startStr)) : '';
        document.getElementById('eventEnd').value = endStr ? formatDateForInput(new Date(endStr)) : '';
        document.getElementById('btnDeleteEvent').classList.add('hidden');

        // Două sloturi inițiale implicite (1. și 2.)
        volunteerSlotsState = [
          { name: '', congregationId: '', congregationName: '', confirmed: false },
          { name: '', congregationId: '', congregationName: '', confirmed: false }
        ];
      }

      renderVolunteerSlots();
    }

    function closeEventModal() {
      document.getElementById('eventModal').classList.add('hidden');
    }

    // Gestionare introducere caractere în input text (căutare live)
    function handleSlotInput(slotIndex, query) {
      const trimmed = query.trim().toLowerCase();
      const suggestionsBox = document.getElementById(`slotSuggestions_${slotIndex}`);
      if (!suggestionsBox) return;

      volunteerSlotsState[slotIndex].name = query;
      volunteerSlotsState[slotIndex].confirmed = false;

      // Căutare automată din toate congregațiile
      const allPeople = getAllRegisteredPeople();
      const filtered = trimmed.length === 0 
        ? allPeople.slice(0, 10) 
        : allPeople.filter(p => p.name.toLowerCase().includes(trimmed));

      if (filtered.length === 0) {
        suggestionsBox.innerHTML = `
          <div class="p-3 text-xs text-slate-500 text-center">
            Niciun rezultat găsit în setări. Poți folosi numele scris direct sau alege din congregații cu butonul <strong>+</strong>.
          </div>
        `;
        suggestionsBox.classList.remove('hidden');
        return;
      }

      suggestionsBox.innerHTML = filtered.map(item => `
        <div onclick="window.selectSuggestedPerson(${slotIndex}, '${item.name.replace(/'/g, "\\'")}', '${item.congId}', '${item.congName.replace(/'/g, "\\'")}')" 
             class="p-2.5 hover:bg-amber-50 cursor-pointer flex justify-between items-center transition">
          <div>
            <span class="font-bold text-slate-800 text-xs">${item.name}</span>
          </div>
          <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">
            ${item.congShort || item.congName}
          </span>
        </div>
      `).join('');

      suggestionsBox.classList.remove('hidden');
    }

    // Selectare persoană din dropdown-ul de sugestii
    function selectSuggestedPerson(slotIndex, name, congId, congName) {
      volunteerSlotsState[slotIndex].name = name;
      volunteerSlotsState[slotIndex].congregationId = congId;
      volunteerSlotsState[slotIndex].congregationName = congName;
      volunteerSlotsState[slotIndex].confirmed = true;

      const suggestionsBox = document.getElementById(`slotSuggestions_${slotIndex}`);
      if (suggestionsBox) suggestionsBox.classList.add('hidden');

      renderVolunteerSlots();
    }

    // Curățare câmp
    function clearSlotInput(slotIndex) {
      volunteerSlotsState[slotIndex].name = '';
      volunteerSlotsState[slotIndex].congregationId = '';
      volunteerSlotsState[slotIndex].congregationName = '';
      volunteerSlotsState[slotIndex].confirmed = false;
      renderVolunteerSlots();
    }

    // Buton Done / Gata pe un slot
    function confirmSlot(slotIndex) {
      const input = document.getElementById(`slotInput_${slotIndex}`);
      const val = input ? input.value.trim() : '';
      if (val.length === 0) {
        alert("Te rog să introduci un nume!");
        return;
      }
      volunteerSlotsState[slotIndex].name = val;
      volunteerSlotsState[slotIndex].confirmed = true;

      // Dacă nu are congregație asociată, o căutăm automat în lista de congregații
      if (!volunteerSlotsState[slotIndex].congregationId) {
        const found = getAllRegisteredPeople().find(p => p.name.toLowerCase() === val.toLowerCase());
        if (found) {
          volunteerSlotsState[slotIndex].congregationId = found.congId;
          volunteerSlotsState[slotIndex].congregationName = found.congName;
        }
      }

      // Închidem sugestiile dacă erau deschise
      const suggestionsBox = document.getElementById(`slotSuggestions_${slotIndex}`);
      if (suggestionsBox) suggestionsBox.classList.add('hidden');

      renderVolunteerSlots();
    }

    // Deschide/Închide selectorul manual (+)
    function toggleManualPicker(slotIndex) {
      const picker = document.getElementById(`slotManualPicker_${slotIndex}`);
      if (!picker) return;
      const isHidden = picker.classList.contains('hidden');
      if (isHidden) {
        picker.classList.remove('hidden');
        populateManualPersonSelect(slotIndex);
      } else {
        picker.classList.add('hidden');
      }
    }

    function handleManualCongChange(slotIndex) {
      populateManualPersonSelect(slotIndex);
    }

    function populateManualPersonSelect(slotIndex) {
      const congSelect = document.getElementById(`manualCongSelect_${slotIndex}`);
      const personSelect = document.getElementById(`manualPersonSelect_${slotIndex}`);
      if (!congSelect || !personSelect) return;

      const selectedCongId = congSelect.value;
      const cong = congregations.find(c => c.id === selectedCongId);
      personSelect.innerHTML = '';

      if (cong && Array.isArray(cong.people) && cong.people.length > 0) {
        cong.people.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p;
          personSelect.appendChild(opt);
        });
      } else {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '-- Fără persoane în congregație --';
        personSelect.appendChild(opt);
      }
    }

    function applyManualSelection(slotIndex) {
      const congSelect = document.getElementById(`manualCongSelect_${slotIndex}`);
      const personSelect = document.getElementById(`manualPersonSelect_${slotIndex}`);
      if (!congSelect || !personSelect) return;

      const personName = personSelect.value;
      const congId = congSelect.value;
      const cong = congregations.find(c => c.id === congId);

      if (!personName) {
        alert("Te rog să alegi o persoană validă din congregație!");
        return;
      }

      volunteerSlotsState[slotIndex].name = personName;
      volunteerSlotsState[slotIndex].congregationId = congId;
      volunteerSlotsState[slotIndex].congregationName = cong ? cong.name : '';
      volunteerSlotsState[slotIndex].confirmed = true;

      renderVolunteerSlots();
    }

    // Adăugare slot nou (persoana a 3-a etc.)
    function addVolunteerSlot() {
      volunteerSlotsState.push({
        name: '',
        congregationId: '',
        congregationName: '',
        confirmed: false
      });
      renderVolunteerSlots();
    }

    // Eliminare slot
    function removeVolunteerSlot(slotIndex) {
      volunteerSlotsState.splice(slotIndex, 1);
      renderVolunteerSlots();
    }

    // Salvare tură completă în Firebase Firestore
    async function saveEvent(e) {
      e.preventDefault();
      const id = document.getElementById('eventId').value || 'evt_' + Date.now();
      
      // Colectăm voluntarii validați
      const finalVolunteers = [];
      const allPeople = getAllRegisteredPeople();

      volunteerSlotsState.forEach((slot, idx) => {
        const inputElem = document.getElementById(`slotInput_${idx}`);
        const currentVal = inputElem ? inputElem.value.trim() : (slot.name || '').trim();
        if (currentVal.length > 0) {
          let cId = slot.congregationId;
          let cName = slot.congregationName;
          
          if (!cId) {
            const found = allPeople.find(p => p.name.toLowerCase() === currentVal.toLowerCase());
            if (found) {
              cId = found.congId;
              cName = found.congName;
            } else if (congregations.length > 0) {
              cId = congregations[0].id;
              cName = congregations[0].name;
            }
          }

          finalVolunteers.push({
            name: currentVal,
            congregationId: cId || '',
            congregationName: cName || ''
          });
        }
      });

      if (finalVolunteers.length === 0) {
        alert("Te rog să introduci cel puțin un voluntar pentru această tură!");
        return;
      }

      // Titlu sintetic pentru FullCalendar
      const formattedTitle = finalVolunteers.map((v, i) => `${i + 1}. ${v.name}`).join('\n');

      const eventData = {
        id: id,
        title: formattedTitle,
        start: document.getElementById('eventStart').value,
        end: document.getElementById('eventEnd').value,
        backgroundColor: document.querySelector('input[name="eventColor"]:checked').value,
        borderColor: document.querySelector('input[name="eventColor"]:checked').value,
        volunteers: finalVolunteers,
        extendedProps: { 
          volunteers: finalVolunteers,
          congregationId: finalVolunteers[0]?.congregationId || '' 
        }
      };
      
      closeEventModal();
      await saveEventToFirebase(eventData);
    }

    async function deleteEvent() {
      const id = document.getElementById('eventId').value;
      if (!id) return;
      if (confirm("Sigur dorești să ștergi această tură?")) {
        closeEventModal();
        await deleteEventFromFirebase(id);
      }
    }

    async function updateEventDates(event) {
      const volunteers = getVolunteersFromEvent(event);
      await saveEventToFirebase({
        id: event.id,
        title: event.title,
        start: event.start.toISOString(),
        end: event.end ? event.end.toISOString() : event.start.toISOString(),
        backgroundColor: event.backgroundColor,
        borderColor: event.borderColor,
        volunteers: volunteers,
        extendedProps: {
          volunteers: volunteers,
          congregationId: event.extendedProps?.congregationId || ''
        }
      });
    }

    function formatDateForInput(date) {
      const d = new Date(date);
      const pad = n => n < 10 ? '0' + n : n;
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

                ${c.people.map((p, idx) => `
                  <div class="flex justify-between items-center bg-slate-50 px-3 py-2 rounded-lg border border-slate-100 text-sm">
                    <span class="font-medium">${p}</span>
                    <div class="flex gap-2">
                      <button onclick="window.editPerson('${c.id}', ${idx})" class="text-slate-400 hover:text-blue-500"><i class="fa-solid fa-pen"></i></button>
                      <button onclick="window.deletePerson('${c.id}', ${idx})" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-trash"></i></button>
                    </div>
                  </div>
                `).join('')}
                ${c.people.length === 0 ? `<p class="text-xs text-slate-400 italic py-1">Nicio persoană adăugată.</p>` : ''}
              </div>
              <button onclick="window.addPerson('${c.id}')" class="text-xs font-semibold text-amber-600 hover:text-amber-700 flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> Adaugă Persoană
              </button>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
      });
    }

    function toggleCongAccordion(id) {
      const el = document.getElementById('acc-' + id);
      if (el) el.classList.toggle('open');
    }

    async function editCongregationDetails(id) {
      let cong = congregations.find(c => c.id === id);
      if(!cong) return;
      let newName = prompt("Introdu numele complet al congregației:", cong.name);
      if (newName === null || newName.trim() === '') return;
      let newShort = prompt("Introdu expresia scurtă de afișat în calendar (ex: Loc, Vec1):", cong.short);
      if (newShort !== null) {
        cong.name = newName.trim();
        cong.short = newShort.trim();
        await saveCongregations();
        renderCongregationsManager();
      }
    }

    async function addPerson(congId) {
      let name = prompt("Introdu numele persoanei:");
      if (name && name.trim() !== '') {
        let cong = congregations.find(c => c.id === congId);
        cong.people.push(name.trim());
        await saveCongregations();
        renderCongregationsManager();
        const acc = document.getElementById('acc-' + congId);
        if (acc) acc.classList.add('open');
      }
    }

    async function editPerson(congId, index) {
      let cong = congregations.find(c => c.id === congId);
      let newName = prompt("Modifică numele:", cong.people[index]);
      if (newName && newName.trim() !== '') {
        cong.people[index] = newName.trim();
        await saveCongregations();
        renderCongregationsManager();
        const acc = document.getElementById('acc-' + congId);
        if (acc) acc.classList.add('open');
      }
    }

    async function deletePerson(congId, index) {
      if (confirm("Sigur ștergi această persoană?")) {
        let cong = congregations.find(c => c.id === congId);
        cong.people.splice(index, 1);
        await saveCongregations();
        renderCongregationsManager();
        const acc = document.getElementById('acc-' + congId);
        if (acc) acc.classList.add('open');
      }
    }

    function openCongregationModal() { 
      renderCongregationsManager();
      document.getElementById('congregationModal').classList.remove('hidden'); 
    }
    function closeCongregationModal() { document.getElementById('congregationModal').classList.add('hidden'); }

    // Închidere sugestii la click în afara casetei
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#volunteerSlotsContainer')) {
        document.querySelectorAll('[id^="slotSuggestions_"]').forEach(el => el.classList.add('hidden'));
      }
    });

    // Mapare funcții pe obiectul window pentru a fi apelate din markup-ul HTML inline
    window.handleAdminButtonClick = handleAdminButtonClick;
    window.closePinModal = closePinModal;
    window.verifyPin = verifyPin;
    window.openCongregationModal = openCongregationModal;
    window.closeCongregationModal = closeCongregationModal;
    window.openEventModal = openEventModal;
    window.closeEventModal = closeEventModal;
    window.openDetailsModal = openDetailsModal;
    window.closeDetailsModal = closeDetailsModal;
    window.editFromDetails = editFromDetails;
    window.saveEvent = saveEvent;
    window.deleteEvent = deleteEvent;
    window.toggleCongAccordion = toggleCongAccordion;
    window.editCongregationDetails = editCongregationDetails;
    window.addPerson = addPerson;
    window.editPerson = editPerson;
    window.deletePerson = deletePerson;
    window.addVolunteerSlot = addVolunteerSlot;
    window.removeVolunteerSlot = removeVolunteerSlot;
    window.handleSlotInput = handleSlotInput;
    window.selectSuggestedPerson = selectSuggestedPerson;
    window.clearSlotInput = clearSlotInput;
    window.confirmSlot = confirmSlot;
    window.toggleManualPicker = toggleManualPicker;
    window.handleManualCongChange = handleManualCongChange;
    window.applyManualSelection = applyManualSelection;

    // Inițializare la pornire
    document.addEventListener('DOMContentLoaded', function() {
      initCalendar();
    });
  </script>
</body>
</html>
